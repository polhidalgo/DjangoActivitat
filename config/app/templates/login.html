<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Iniciar de Sessió</title>
</head>
<body>
    <h2>Inici de Sessió</h2>
    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Iniciar Sessió</button>
    </form>
    <p>No tens user? <a href="{% url 'register' %}">Registrat aquí</a></p>
</body>
</html>
